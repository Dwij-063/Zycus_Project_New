# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/stockpulse
spring.datasource.username=postgres
spring.datasource.password=dwij123

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server
server.port=8080

# StockPulse
stockpulse.demand-spike.multiplier=1.5

# AI
stockpulse.ai.enabled=true
stockpulse.ai.provider=gemini
stockpulse.ai.model=gemini-1.5-flash
stockpulse.ai.api-key=${GEMINI_API_KEY}